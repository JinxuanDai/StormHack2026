[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-panic"
version = "0.1.0"
description = "Cooperative hospital laboratory game prototype"
requires-python = ">=3.12,<3.14"
dependencies = ["pygame==2.6.1"]

[project.scripts]
lab-panic = "lab_panic.main:main"

[tool.setuptools.packages.find]
where = ["src"]
